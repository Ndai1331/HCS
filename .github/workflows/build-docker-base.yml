
name: Build Docker base images

on:
  push:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      base_tag:
        description: 'Docker base image tag (hc-blazor-base / hc-api-base)'
        required: true
        default: libreoffice-v1
        type: string
      clear_docker_cache:
        description: 'Run docker image prune before build'
        required: false
        default: false
        type: boolean

concurrency:
  group: build-docker-base-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push-base:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[rebuild-base]'))
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve base tag
        id: base
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_BASE_TAG: ${{ github.event.inputs.base_tag }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "tag=$INPUT_BASE_TAG" >> "$GITHUB_OUTPUT"
            echo "Resolved base tag (manual): $INPUT_BASE_TAG"
            exit 0
          fi
          echo "tag=libreoffice-v1" >> "$GITHUB_OUTPUT"
          echo "Resolved base tag (commit [rebuild-base]): libreoffice-v1"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push base images
        shell: pwsh
        run: |
          $clearCache = '${{ github.event_name }}' -eq 'push' -or '${{ github.event.inputs.clear_docker_cache }}' -eq 'true'
          if ($clearCache) {
            ./build-docker-base-linux-amd64.ps1 -BaseTag '${{ steps.base.outputs.tag }}' -ClearDockerCache
          } else {
            ./build-docker-base-linux-amd64.ps1 -BaseTag '${{ steps.base.outputs.tag }}'
          }
