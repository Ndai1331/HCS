# Build and push HC Blazor + API Docker images (linux/amd64) when the commit
# message contains a release tag, or when triggered manually.
#
# Commit message tags (first match wins if both appear):
#   [latest01042026] -> image tag latest01042026
#   [latestlvt]      -> image tag latestlvt
#
# Required repo secrets:
#   DOCKER_USERNAME, DOCKER_TOKEN — Docker Hub login for push.
# If `dotnet restore` fails in CI (ABP Commercial), add the commercial feed URL to
# NuGet.Config in the repo or configure credentials via a setup step / environment.

name: Build API + Blazor Docker images

on:
  push:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      image_version:
        description: 'Docker image tag to build and push'
        required: true
        type: choice
        options:
          - latest01042026
          - latestlvt

concurrency:
  group: build-api-blazor-docker-${{ github.ref }}
  cancel-in-progress: true


jobs:
  build-and-push:
    # workflow_dispatch has no head_commit; only inspect message on push.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && (
        contains(github.event.head_commit.message, '[latest01042026]') ||
        contains(github.event.head_commit.message, '[latestlvt]')
      ))
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.image_version }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "version=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
            echo "Resolved version (manual): $INPUT_VERSION"
            exit 0
          fi
          COMMIT_MSG="$(git log -1 --pretty=%B)"
          if echo "$COMMIT_MSG" | grep -qF '[latest01042026]'; then
            echo "version=latest01042026" >> "$GITHUB_OUTPUT"
            echo "Resolved version (commit): latest01042026"
          elif echo "$COMMIT_MSG" | grep -qF '[latestlvt]'; then
            echo "version=latestlvt" >> "$GITHUB_OUTPUT"
            echo "Resolved version (commit): latestlvt"
          else
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "::error::No recognized tag in commit message."
            exit 1
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (Blazor + API)
        shell: pwsh
        run: |
          ./build-api-blazor-linux-amd64.ps1 -version '${{ steps.version.outputs.version }}' -ClearDockerCache
