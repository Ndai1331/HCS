name: Build PushNotificationWorker Docker image

on:
  push:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      image_version:
        description: 'Docker image tag to build and push'
        required: true
        type: choice
        options:
          - latest01042026
          - latestlvt

concurrency:
  group: build-pushnotification-docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    # workflow_dispatch has no head_commit; only inspect message on push.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[pushnoti]'))
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.image_version }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "version=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
            echo "Resolved version (manual): $INPUT_VERSION"
            exit 0
          fi
          COMMIT_MSG="$(git log -1 --pretty=%B)"
          if echo "$COMMIT_MSG" | grep -qF '[latestlvt]'; then
            echo "version=latestlvt" >> "$GITHUB_OUTPUT"
            echo "Resolved version (commit): latestlvt"
          elif echo "$COMMIT_MSG" | grep -qF '[latest01042026]'; then
            echo "version=latest01042026" >> "$GITHUB_OUTPUT"
            echo "Resolved version (commit): latest01042026"
          else
            echo "version=latest01042026" >> "$GITHUB_OUTPUT"
            echo "Resolved version (commit): latest01042026 (default)"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (PushNotificationWorker)
        shell: pwsh
        run: |
          ./build-pushnotification-linux-amd64.ps1 -version '${{ steps.version.outputs.version }}' -ClearDockerCache
